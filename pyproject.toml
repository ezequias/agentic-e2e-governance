[project]
name = "agentic-e2e-governance"
version = "0.1.0"
description = "Reference skeleton for a governed, LLM-agnostic agent architecture"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
